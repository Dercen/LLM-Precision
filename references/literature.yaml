# Published perplexities the aggregator joins our rows against. PLAN.md 13.
#
# seqlen 2048, fp16. Every row names its source table and the calibration set that
# table used, so the join can never pair one of our rows with a paper number that
# was produced under a different calibration (PLAN.md 9.5).
#
# dataset_key is OUR key, not the paper's prose. The OPT ptb/c4 rows were
# protocol_uncertain in the original plan because the GPTQ README does not say
# whether Tables 9 and 11 used get_ptb/get_c4 or the --new-eval variants. M2
# resolved this empirically on opt-125m (PLAN.md 7): the --new-eval variants
# reproduce the published numbers to within 0.1% on both the fp16 and the RTN4
# column, while the plain keys miss by 7-17%.

meta:
  protocol_version: 1
  seqlen: 2048
  dtype: fp16
  resolved_at: 2026-09-21
  gptq_pdf_verified: 2026-09-21   # Tables 3, 9, 11 read from arXiv 2210.17323 directly

calibrations:
  gptq_c4: {dataset: c4, nsamples: 128, seqlen: 2048, seed: 0}
  awq_pile: {dataset: pile_val, nsamples: 128, seqlen: 512}
  omniquant_wikitext2: {dataset: wikitext2, nsamples: 128, seqlen: 2048}

